<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stanley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12242B;
    --text: #EFE9DC;
    --muted: #A9B7B4;
    --accent: #D9A441;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    font-family: 'Space Grotesk', sans-serif;
  }

  .hero h1 {
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .hero p {
    margin-top: 0.9rem;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 400;
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    color: var(--muted);
    letter-spacing: -0.01em;
  }

  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--accent);
    margin-left: 0.15em;
    vertical-align: -0.15em;
    animation: blink 1.1s step-end infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="hero">
    <h1>Hey, I&rsquo;m Stanley.</h1>
    <p>I&rsquo;m working on engineering at Zapier.<span class="cursor" aria-hidden="true"></span></p>
  </div>
</body>
</html>
